[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[project]
name = "bsk-unreal-render-interface"
version = "0.2.0"
description = "Renderer-neutral Basilisk transport and Unreal Engine 5 runtime visualization interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["bsk_render_adapter", "bsk_unreal_adapter"]
package-dir = {bsk_render_adapter = "Adapters/bsk_render_adapter", bsk_unreal_adapter = "Unreal/BskUnrealRenderer/python/bsk_unreal_adapter"}
