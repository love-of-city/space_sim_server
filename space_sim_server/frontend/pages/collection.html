<div class="page-heading"><div><h1>自动采集</h1><p>创建采集批次，查看实例进度与验收结果。</p></div><button id="new-collection" class="button primary" type="button">＋ 新建采集</button></div>
<p id="notice" class="notice error" role="status" hidden></p>
<section id="setup" class="panel" hidden>
  <div class="panel-heading"><h2>新建采集批次</h2><button id="close-setup" class="button" type="button">关闭</button></div>
  <form id="collection-form" class="panel-body">
    <label class="field">采集任务<select id="task" name="task" required></select></label>
    <p id="task-description" class="muted"></p>
    <div class="form-grid"><label class="field">成功记录数<input name="count" type="number" min="1" max="1000" value="5" required></label><label class="field">并行实例<select id="workers" name="workers"><option value="1">1 路</option><option value="2" selected>2 路</option><option value="3">3 路</option><option value="4">4 路</option></select></label></div>
    <label id="drawer-speed-field" class="field">移动速度（m/s）<input id="linear-speed" name="linear_speed_m_s" type="number" min="0.005" max="0.1" step="0.005" value="0.1" required><small>用于空程和抽出、放回主体行程；接近把手与最终归位时自动减速。</small></label>
    <label id="threaded-speed-field" class="field" hidden>螺丝任务速度<select id="threaded-speed-profile" name="threaded_speed_profile" disabled><option value="fast_collection" selected>快速采集</option><option value="default">原始速度</option></select><small>快速采集同步接近、转向与开爪，保留真实卡扣抓取、同轴旋拧和松爪换抓。</small></label>
    <div class="form-section">初始化与重试</div>
    <label class="randomization-toggle"><input id="overview-camera-randomization" type="checkbox" checked><span>全局相机随机初始化（5 个固定机位）</span></label>
    <p class="muted">每条任务从卫星实体底板任务板左侧等间距排列的 5 个安装机位中随机选择，高度 45 cm，视野 85°，配有随相机补光，整段保持固定；机位与安装点随记录保存。</p>
    <label class="randomization-toggle"><input id="layout-randomization" type="checkbox" disabled><span>操作台位置与朝向随机化</span></label>
    <p id="layout-description" class="muted">正在检查可用布局…</p>
    <label class="randomization-toggle"><input id="initialization-enabled" type="checkbox" checked><span>启用初始关节角随机化</span></label>
    <div class="form-grid"><label class="field">关节初始偏移（±°）<input id="range-deg" name="range_deg" type="number" min="0" max="50" step="0.5" value="10" required><small>支持 0–50°，默认 10°；六个关节独立采样，超限、初始碰撞或接近路径检查失败时拒绝该初态。</small></label><label class="field">最多尝试次数<input name="max_attempts" type="number" min="1" max="1000" value="15" required><small>达到成功记录数或尝试上限即结束。</small></label></div>
    <div class="form-section">噪声、扰动与环境随机化</div>
    <p class="muted">各项独立启用，默认关闭。参数为工程试验起点；较强扰动可能使任务失败，安全保护和成功判据始终依据真实状态。</p>
    <div id="randomization-options" class="randomization-options"></div>
    <details style="margin-top:18px"><summary>高级设置与采样规格</summary><label class="field" style="margin-top:14px">随机种子<input name="seed" type="number" min="0" max="2147482647" value="20261016" required></label><dl id="specifications" class="specifications"></dl></details>
    <p class="form-note">后台一次运行一个批次。切换页面不会停止采集，可在下方查看进度和停止任务。</p>
    <div class="form-actions"><button id="cancel-setup" class="button" type="button">取消</button><button id="submit" class="button primary" type="submit" disabled>开始自动采集</button></div>
  </form>
</section>
<div class="section-heading-row"><h2>当前批次</h2><span id="refresh-state">正在连接…</span></div>
<div id="jobs"><div class="panel empty">正在读取采集批次…</div></div>
<div class="section-heading-row"><h2>历史批次</h2><span id="history-count"></span></div>
<div id="history" class="history-list"></div>
