[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[project]
name = "space-arm-data-platform"
version = "0.2.0"
description = "Space manipulator teleoperation and synchronized dataset collection platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
  "lerobot==0.4.4",
  # LeRobot/datasets scalar serialization is incompatible with NumPy 2.4.
  "numpy>=1.24,<2.4",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0"]
simulation = ["numpy>=1.24"]
# Offline posture worker only; never import Python MuJoCo into live Basilisk.
posture = ["numpy>=1.24", "mujoco==3.7.0"]

[project.scripts]
space-arm-platform = "space_arm_platform.main:main"

[tool.setuptools]
packages = ["space_arm_platform"]
package-dir = {space_arm_platform = "backend/space_arm_platform"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
