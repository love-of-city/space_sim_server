<div class="page-heading"><div><h1>自动采集</h1><p>创建采集批次，查看实例进度与验收结果。</p></div><button id="new-collection" class="button primary" type="button">＋ 新建采集</button></div>
<p id="notice" class="notice error" role="status" hidden></p>
<section id="setup" class="panel" hidden>
  <div class="panel-heading"><h2>新建采集批次</h2><button id="close-setup" class="button" type="button">关闭</button></div>
  <form id="collection-form" class="panel-body">
    <label class="field">采集任务<select id="task" name="task" required></select></label>
    <p class="muted">接近 → 调整夹爪 → 夹持 → 抽出 → 放回 → 松爪 → 撤离。</p>
    <div class="form-grid"><label class="field">成功记录数<input name="count" type="number" min="1" max="1000" value="5" required></label><label class="field">并行实例<select id="workers" name="workers"><option value="1">1 路</option><option value="2" selected>2 路</option><option value="3">3 路</option><option value="4">4 路</option></select></label></div>
    <div class="form-section">初始化与重试</div>
    <div class="form-grid"><label class="field">关节初始偏移（±°）<input name="range_deg" type="number" min="0" max="10" step="0.5" value="10" required><small>六个关节独立采样，并检查关节限制和碰撞。</small></label><label class="field">最多尝试次数<input name="max_attempts" type="number" min="1" max="1000" value="15" required><small>达到成功记录数或尝试上限即结束。</small></label></div>
    <details style="margin-top:18px"><summary>高级设置与采样规格</summary><label class="field" style="margin-top:14px">随机种子<input name="seed" type="number" min="0" max="2147482647" value="20261016" required></label><dl id="specifications" class="specifications"></dl></details>
    <p class="form-note">后台一次运行一个批次。切换页面不会停止采集，可在下方查看进度和停止任务。</p>
    <div class="form-actions"><button id="cancel-setup" class="button" type="button">取消</button><button id="submit" class="button primary" type="submit" disabled>开始自动采集</button></div>
  </form>
</section>
<div class="section-heading-row"><h2>当前批次</h2><span id="refresh-state">正在连接…</span></div>
<div id="jobs"><div class="panel empty">正在读取采集批次…</div></div>
<div class="section-heading-row"><h2>历史批次</h2><span id="history-count"></span></div>
<div id="history" class="history-list"></div>
