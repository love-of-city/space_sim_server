name: Basic CI
on:
  pull_request:
  push:
    branches: [main, master, zmh_linux]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: server-python
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      # The week in the key re-resolves unpinned dependencies at least weekly.
      - name: Dependency cache week
        id: week
        run: '"value=$(Get-Date -UFormat %Y-%V)" >> $env:GITHUB_OUTPUT'
      - name: Restore Python environment
        id: venv
        uses: actions/cache/restore@v4
        with:
          path: .venv-ci
          key: monorepo-venv-v1-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('server/pyproject.toml', 'ue-adapter/pyproject.toml') }}-${{ steps.week.outputs.value }}
      - name: Install declared dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ../.venv-ci
          ../.venv-ci/Scripts/python -m pip install -e "../ue-adapter[test]" -e ".[test,simulation,posture,vision]" "ruff==0.15.7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Save right after installing so a failing test run still warms the cache.
      - name: Save Python environment
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .venv-ci
          key: ${{ steps.venv.outputs.cache-primary-key }}
      - name: Activate Python environment
        run: (Resolve-Path ../.venv-ci/Scripts).Path >> $env:GITHUB_PATH
      # Editable installs contain absolute source paths. A restored environment
      # must bind both packages to this checkout after repository/path changes.
      - name: Refresh editable project paths
        run: python -m pip install --no-deps -e "../ue-adapter" -e "."
      - name: Check installed dependencies
        run: |
          python -c "import sys; assert sys.prefix != sys.base_prefix, sys.prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import bsk_render_adapter, space_arm_platform"
      - name: Python syntax and undefined names
        run: python -m ruff check .
      - name: Verify CI failure guards
        run: python scripts/verify_ci_guards.py
      # Pull requests skip the deployment group unless they touch what it tests;
      # pushes to main and manual runs always run everything.
      - name: Detect deployment changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deploy:
              - 'server/scripts/deploy*.ps1'
              - 'server/scripts/public_deployment*.ps1'
              - 'server/scripts/fixed_deployment_helpers.ps1'
              - 'server/scripts/show_public_access.ps1'
              - 'server/scripts/run_platform.ps1'
              - 'server/*_deployment.sh'
              - 'server/show_deployment_access.sh'
              - 'server/scripts/linux_platform.sh'
              - 'server/backend/space_arm_platform/linux_*.py'
              - 'server/backend/space_arm_platform/scene_runtime.py'
              - 'server/backend/space_arm_platform/app.py'
              - 'server/backend/space_arm_platform/main.py'
              - 'server/tests/test_linux_deployment.py'
              - 'server/scripts/run_backend.ps1'
              - 'server/scripts/start_scene_instance.ps1'
              - 'ue-adapter/Unreal/BskUnrealRenderer/scripts/start_renderer.ps1'
              - 'server/scripts/run_simulation.ps1'
              - 'server/scripts/prepare_sarm_scene.ps1'
              - 'server/tools/assets/select_sarm_scene.py'
              - 'server/tools/assets/prepare_sarm_assets.py'
              - 'server/tools/assets/build_unreal_linux.py'
              - 'server/scripts/stop_platform.ps1'
              - 'server/scripts/python_runtime.ps1'
              - 'server/scripts/platform_paths.ps1'
              - 'server/scripts/posture_runtime.ps1'
              - 'server/scripts/native_acceleration_runtime.ps1'
              - 'ue-adapter/Unreal/BskUnrealRenderer/scripts/prepare_mjcf_assets.ps1'
              - 'ue-adapter/Unreal/BskUnrealRenderer/scripts/generate_mjcf_asset_catalog.py'
              - 'server/scripts/ci*'
              - 'server/scripts/verify_ci_guards.py'
              - 'server/deploy/**'
              - 'server/tools/deployment/check_deployment_auth.py'
              - 'server/tools/deployment/prepare_public_auth.py'
              - 'server/*_deployment.cmd'
              - 'server/tests/test_deployment_launcher.py'
              - 'server/tests/test_public_deployment.py'
              - 'server/tests/test_fixed_deployment.py'
              - 'server/tests/test_deployment_scripts.py'
              - 'server/scripts/start_secure_pixel_streaming.ps1'
              - 'server/signalling/**'
              - 'server/backend/space_arm_platform/rendezvous_runtime.py'
              - 'server/backend/space_arm_platform/near_field_config.py'
              - 'server/simulation/near_field/**'
              - 'ue-adapter/Adapters/bsk_render_adapter/near_field.py'
              - 'ue-adapter/Unreal/BskUnrealRenderer/Plugins/BskUnrealRuntime/Source/**'
              - 'server/scripts/*scene*.ps1'
              - '.github/**'
              - 'server/pyproject.toml'
              - '.gitattributes'
              - 'server/.gitattributes'
              - 'ue-adapter/.gitattributes'
              - 'ue-adapter/pyproject.toml'
              - 'ue-adapter/scripts/**'
              - 'ue-adapter/Unreal/BskUnrealRenderer/scripts/**'
      - name: Basic Python tests
        env:
          SKIP_DEPLOY: ${{ github.event_name == 'pull_request' && steps.changes.outputs.deploy != 'true' }}
        run: |
          $env:PYTHONPATH = "$PWD/scripts;$PWD"
          $env:SPACE_SIM_RESET_ADAPTER = (Resolve-Path ../ue-adapter).Path
          $env:PYTEST_ADDOPTS = '-p ci_pytest --ci-basic -n 4 --junitxml=reports/python.xml'
          if ($env:SKIP_DEPLOY -eq 'true') {
            Write-Host '::notice::Deployment tests skipped: this pull request changes no deployment paths. Pushes to main run them.'
            $env:PYTEST_ADDOPTS += ' --ci-skip-group deploy'
          }
          python -m pytest -ra
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-python-report
          path: server/reports/
          if-no-files-found: warn
  web:
    name: server-web
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/frontend/package-lock.json
            server/signalling/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix signalling ci --no-audit --no-fund
      - run: npm --prefix signalling test
      - run: npm --prefix signalling run check
  adapter:
    name: adapter-python
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: ue-adapter
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared dependencies
        run: |
          python -m pip install -e ".[test]" "ruff==0.15.7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Python syntax and undefined names
        run: python -m ruff check .
      - name: Verify CI failure guards
        run: python scripts/verify_ci_guards.py
      - name: Release version consistency
        run: python scripts/check_versions.py
      - name: Basic Python tests
        run: |
          $env:PYTHONPATH = "$PWD/scripts;$PWD"
          $env:PYTEST_ADDOPTS = '-p ci_pytest --ci-basic --junitxml=reports/python.xml'
          ./scripts/test.ps1 -SkipUnreal -Python (Get-Command python).Source
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-python-report
          path: ue-adapter/reports/
          if-no-files-found: warn

  linux-layout:
    name: linux-layout-and-packaging
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install adapter and test dependencies
        run: python -m pip install -e './ue-adapter[test]' pytest-xdist
      - name: Linux adapter Python checks
        working-directory: ue-adapter
        env:
          PYTHONPATH: scripts:.
        run: python -m pytest -q -p ci_pytest --ci-basic --ci-skip-group windows-runtime
      - name: Portable packaging and launcher checks
        run: |
          python -m pytest -q tools/release/tests/test_packaging.py tools/release/tests/test_ue_build_tools.py tools/release/tests/test_runtime_metadata.py tools/release/tests/layout_preparer/test_launcher.py
          python tools/release/tests/layout_preparer/test_self_extractor.py
