<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
 <title id="title">Cooperative three-jaw capture interface: engineering concept</title>
 <desc id="desc">Three service-side radial jaws at 120 degrees retain a target-side mushroom head. The separate simulation mapping uses the unchanged two-finger gripper and a logical latch, without physical contact or load transfer. All dimensions are unverified engineering initial values.</desc>
 <defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#172b40"/></marker>
  <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b40;font-size:17px}.title{font-size:25px;font-weight:bold}.small{font-size:15px}.label{font-weight:bold}.service{fill:#d8e9fa;stroke:#172b40;stroke-width:2}.target{fill:#f6e6c7;stroke:#172b40;stroke-width:2}.line{fill:none;stroke:#172b40;stroke-width:1.8}.dim{fill:none;stroke:#172b40;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style>
 </defs>
 <rect width="1120" height="670" fill="white"/>
 <text x="28" y="38" class="title">Cooperative capture interface / 配对三爪结构初值</text>
 <text x="28" y="66">Dimensions: mm, not to scale. Concept only; no strength, vacuum or contact-mechanics qualification.</text>
 <path d="M550 92 V445" stroke="#aab6c2"/>
 <text x="28" y="112" class="label">A. End view, looking along approach +Z_G</text>
 <circle cx="240" cy="260" r="80" class="target"/>
 <circle cx="240" cy="260" r="40" class="line dash"/>
 <path d="M140 260 H340 M240 160 V360" class="line dash"/>
 <g class="service">
  <rect x="332" y="241" width="65" height="38"/>
  <rect x="332" y="241" width="65" height="38" transform="rotate(120 240 260)"/>
  <rect x="332" y="241" width="65" height="38" transform="rotate(240 240 260)"/>
 </g>
 <path d="M380 225 H331" class="line" marker-end="url(#arrow)"/>
 <text x="348" y="197">13 radial travel</text>
 <path d="M470 180 V340" class="dim"/>
 <path d="M240 180 H479 M240 340 H479" class="line"/>
 <text x="429" y="365">head Ø40</text>
 <path d="M204 247 L86 186" class="line"/>
 <text x="28" y="166">neck Ø20</text><text x="28" y="186" class="small">dashed, behind head</text>
 <text x="28" y="420">Service jaws: 3 × 120°, open clear Ø46 → neck Ø20.</text>
 <text x="580" y="112" class="label">B. Axial section (third jaw omitted)</text>
 <rect x="615" y="194" width="18" height="132" class="target"/>
 <rect x="633" y="234" width="96" height="52" class="target"/>
 <rect x="729" y="207" width="36" height="106" class="target"/>
 <path d="M800 177 H687 V222 H709 V199 H800 Z" class="service"/>
 <path d="M800 343 H687 V298 H709 V321 H800 Z" class="service"/>
 <text x="846" y="146">service jaw hooks</text>
 <text x="846" y="377">retain behind head</text>
 <path d="M698 193 L847 169 M698 325 L847 353" class="line"/>
 <path d="M865 261 H785" class="line" marker-end="url(#arrow)"/>
 <text x="873" y="266">approach +Z_G</text>
 <path d="M729 340 H765" class="dim"/><text x="728" y="366">6 thick</text>
 <path d="M633 176 H729" class="dim"/><text x="642" y="157">16 neck length</text>
 <text x="582" y="405">Target: flange Ø50; entry chamfer 2 × 45°.</text>
 <text x="582" y="429">Positive retention + normally engaged brake.</text>
 <rect x="28" y="456" width="1064" height="186" rx="8" fill="#f3f6fa" stroke="#aab6c2"/>
 <text x="44" y="485" class="label">C. Ownership, control and simulation mapping</text>
 <text x="44" y="514">Target owns mushroom + rigid 80 mm visual marker. Service owns jaws + scroll drive + brake.</text>
 <text x="44" y="541">Entry tolerance: transverse ±3 mm, angle ≤1°, insertion ≤1 mm/s; hold design point 15 N (unverified).</text>
 <text x="44" y="568">Real confirmation: 3 jaw switches + brake state + contact/load evidence. Release after unloading.</text>
 <text x="44" y="595" class="label">Demo: existing TWO fingers, virtual h≈18 mm contact window, logical latch; no new geometry.</text>
 <text x="44" y="622">No weld / attachment / load transfer. Dimensions are not inferred from the demo's zero-contact result.</text>
</svg>
